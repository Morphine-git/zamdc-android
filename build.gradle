plugins {
    id 'com.android.application'
}

android {
    namespace "com.flycast.wrapper"
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.flycast.wrapper"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"

        // ✅ (1) ABI filter MUST be inside defaultConfig
        ndk {
            abiFilters "arm64-v8a"
            // add more only if you really need them:
            // abiFilters "armeabi-v7a", "x86_64"
        }

        // ✅ (2) Tell Gradle/CMake which target to build
        externalNativeBuild {
            cmake {
                targets "zamdc"
            }
        }

        /* ... your existing config ... */
    }

    signingConfigs {
        release {
            storeFile file("my-release.keystore")   // adjust name if different
            storePassword "JuanChatGPT2025!"
            keyAlias "flycast"
            keyPassword "JuanChatGPT2025!"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            debuggable false
        }
        debug {
            signingConfig signingConfigs.release
            debuggable true
        }
    }

    // ✅ (3) Point Gradle to your CMakeLists.txt (inside android{}, OUTSIDE defaultConfig)
    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    // Prevent duplicate native libs & meta-inf
    packagingOptions {
        pickFirst "**/*.so"
        pickFirst "**/*.jar"
        pickFirst "**/META-INF/*"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // ✅ Keep buildFeatures here ONLY (not inside defaultConfig)
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.documentfile:documentfile:1.0.1"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"

    // Cover images (Glide) ✅ keep only one copy
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // JSON + HTTP for online fetch
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
}
